[project]
name = "battery-modelling"
version = "0.1.0"
description = "Core temperature estimation of Li-ion batteries using physics-based ECM + EETM + Transformer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "h5py>=3.9.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "requests>=2.28.0",
    "pybamm>=23.9",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "streamlit>=1.50.0",
    "plotly>=6.6.0",
]

[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ecm", "eetm", "generation", "transformer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
